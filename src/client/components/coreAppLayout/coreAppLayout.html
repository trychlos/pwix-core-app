<template name="coreAppLayout">
    <div class="core-app-layout {{ colorTheme }} {{ layoutTheme }}">

        {{#if wantHeader }}
            {{> coreAppHeader }}
        {{/if}}

        {{> coreAppContent template=(template) data=(data) }}

        {{#if wantFooter }}
            {{> coreAppFooter }}
        {{/if}}

    </div>
</template>

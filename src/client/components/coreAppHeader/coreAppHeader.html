<template name="coreAppHeader">
    <div class="core-app-header">

        <div class="core-app-header-left">
            <a href="/">
                    {{> coreSiteLogo }}
                    {{> coreSiteName }}
                    {{> coreSiteEnv }}
            </a>
            <div class="ui-ml1"></div>
            <!--
            {{> organization_header }}
            -->
        </div>

        <div class="core-app-header-middle">
            <div class="ui-ml1"></div>
        </div>

        <div class="core-app-header-right">
            <div class="{{ display it="EDIT_SWITCH" }}">
                {{> AppPagesEditButton (parmsEditButton) }}
            </div>
            {{#if haveLanguageSelector }}
                <div class="{{ display it="LANG_SELECT" }}">
                    {{> piLanguageSelector (parmsLanguageSelector) }}
                </div>
            {{/if}}
            <div class="{{ display it="USER_BUTTON" }} d-flex">
                <div class="ui-ml05"></div>
                {{> acUserLogin (parmsUserLogin) }}
            </div>
            <div class="{{ display it="MENU_BUTTON" }} d-flex">
                <div class="ui-ml05"></div>
                {{> coreAppMenuButton (parmsAppMenu) }}
            </div>
        </div>

    </div>
</template>
